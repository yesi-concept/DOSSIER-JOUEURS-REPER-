<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#1c1a17;--muted:#7a7266;--line:#e4dccb;
  --gold:#b8913a;--gold2:#d9b45f;--dark:#14130f;--ok:#2f7d4f;--warn:#c27a1a;--bad:#b23b3b;
  --pitch:#2f6b3f;--pitch2:#2a6139;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px;font-size:15px}
header{background:var(--dark);color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:20}
header .hrow{display:flex;align-items:center;gap:12px}
header .logo{height:52px;width:auto;background:#fff;border-radius:10px;padding:3px 6px;flex:none}
.rlogo{height:46px;width:auto;flex:none}
header .brand{font-size:11px;letter-spacing:3px;color:var(--gold2);font-weight:700}
header h1{font-size:20px;margin-top:2px}
header .sub{font-size:12px;color:#bdb5a5;margin-top:3px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);position:sticky;top:80px;z-index:19;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:20px;font-weight:600;font-size:13px;color:var(--ink)}
nav button.on{background:var(--dark);color:var(--gold2);border-color:var(--dark)}
main{padding:14px 16px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.alert{border-color:var(--warn);background:#fff8ec}
h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:16px 0 8px}
h2 .count{font-size:12px;background:var(--line);padding:2px 8px;border-radius:10px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;border:none;background:var(--gold);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.btn.dark{background:var(--dark);color:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--bad)}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.full{width:100%;margin-top:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select,.filters input{padding:9px;font-size:13px}
.drop{border:2px dashed var(--gold);border-radius:14px;padding:18px 14px;text-align:center;background:#fffaf0;margin-bottom:12px;cursor:pointer}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop span{font-size:12px;color:var(--muted)}
.drop.hover{background:#f6e7c4}
.player{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.player:first-of-type{border-top:none}
.rank{width:22px;font-weight:800;color:var(--gold);text-align:center;font-size:14px;flex:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--line);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:14px}
.avatar.xl{width:72px;height:72px;font-size:22px;border:3px solid var(--gold)}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--muted)}
.score{text-align:right;flex:none}
.score b{font-size:18px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.star{color:var(--gold);font-size:13px}
.trend{font-size:11px;font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.tierhead{display:flex;justify-content:space-between;align-items:center}
.tierhead .range{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.rep{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center;cursor:pointer}
.rep .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.rep .n{font-weight:800;font-size:18px}
.rep small{color:var(--muted);display:block;font-size:12px}
/* critères */
.crit{padding:8px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:none}
.cl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.cl b{color:var(--gold);font-size:15px}
.chips10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.chips10 button{border:1px solid var(--line);background:#fff;border-radius:7px;height:34px;font-weight:700;font-size:13px;color:var(--ink)}
.chips10 button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chips10 button.in{background:#f3e6c6;border-color:#e8d5a5}
.livenote{position:sticky;bottom:0;background:var(--dark);color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.livenote b{font-size:24px;color:var(--gold2)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img,.photo-pick .ph{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;flex:none}
/* fiche rapport */
.rhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.rhead img,.rhead .ph{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--muted);border:3px solid var(--gold)}
.infos{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--bg);border-radius:12px;padding:12px;font-size:13px}
.infos span{color:var(--muted);display:block;font-size:11px}
.bar{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.bar .t{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.bar b{text-align:right}
.bignote{background:var(--dark);color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.bignote b{font-size:34px;color:var(--gold2)}
.bignote small{display:block;font-size:11px;color:#bdb5a5;letter-spacing:2px}
svg.radar{width:100%;max-width:340px;display:block;margin:6px auto}
svg.spark{width:100%;height:110px;margin-top:6px}
/* terrain */
.pitch{position:relative;width:100%;padding-top:150%;background:repeating-linear-gradient(180deg,var(--pitch) 0 9%,var(--pitch2) 9% 18%);border-radius:14px;overflow:hidden;border:2px solid #1f4a2b}
.pitch .lines{position:absolute;inset:0}
.slot{position:absolute;transform:translateX(-50%);width:78px;background:rgba(20,19,15,.82);border-radius:9px;padding:3px;cursor:pointer;border:1px solid rgba(217,180,95,.5)}
.slot .sl{font-size:9px;font-weight:800;color:var(--gold2);text-align:center;letter-spacing:1px;padding:1px 0 2px}
.srow{display:flex;align-items:center;gap:3px;padding:2px;border-radius:5px;color:#fff;font-size:10px;line-height:1.1}
.srow.t{background:var(--gold)}
.srow .a{width:16px;height:16px;border-radius:50%;background:#555;flex:none;object-fit:cover;font-size:8px;display:flex;align-items:center;justify-content:center}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.srow .v{font-weight:800;font-size:9px}
.slot .add{color:var(--gold2);text-align:center;font-size:16px;font-weight:800;padding:2px 0}
/* divers */
.pend{border-top:1px solid #f0d9b0;padding:12px 0}
.pend:first-of-type{border-top:none}
.fname{font-weight:700;font-size:13px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--line)}
.chip.miss{background:#f6d6d6;color:var(--bad);font-weight:700}
details{margin-top:6px;font-size:12px;color:var(--muted)}
details pre{white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:8px;margin-top:4px;font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(20,19,15,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px 34px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.x{background:var(--line);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;flex:none;color:var(--ink)}
.back{background:none;border:none;color:var(--gold);font-weight:700;font-size:14px;padding:4px 0}
.fab{position:fixed;right:16px;bottom:20px;background:var(--gold);color:#fff;border:none;border-radius:30px;padding:15px 22px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:30}
.menu{position:fixed;right:16px;bottom:82px;z-index:31;display:none;flex-direction:column;gap:8px;align-items:flex-end}
.menu.open{display:flex}
.menu button{background:var(--dark);color:#fff;border:none;border-radius:24px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tierrow{display:grid;grid-template-columns:1.4fr .7fr 50px;gap:8px;align-items:center;margin-bottom:8px}
.tierrow input[type=color]{padding:2px;height:42px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.obs{background:#efe8d8;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);margin-top:6px}
.busy{position:fixed;inset:0;background:rgba(20,19,15,.75);z-index:60;display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:20px;white-space:pre-line}
.busy.open{display:flex}
.toast{position:fixed;left:16px;right:16px;bottom:84px;background:var(--dark);color:#fff;padding:14px;border-radius:12px;z-index:70;font-size:14px;line-height:1.5;display:none;max-width:600px;margin:0 auto;border-left:4px solid var(--gold)}
.toast.open{display:block}
@media(min-width:700px){.slot{width:110px}.srow{font-size:12px}.srow .a{width:20px;height:20px}}
@media print{
  header,nav,.fab,.menu,.btns,.filters,.drop,.noprint,.toast{display:none!important}
  body{background:#fff;padding:0}
  .card{break-inside:avoid;border-color:#ccc}
  body.psheet>*:not(#ov){display:none!important}
  body.psheet #ov{position:static;display:block;background:none}
  body.psheet .sheet{max-height:none;overflow:visible;border-radius:0;padding:0;max-width:none}
  .pitch,.slot,.srow.t,.bignote,.chips10 button.on{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<div class="busy" id="busy"></div>
<div class="toast" id="toast" onclick="this.classList.remove('open')"></div>

<script>
/* ================= CONFIG ================= */
const KEY='nes_dossier_v2', OLD_KEY='nes_dossier_classement_v1';
const POSTES=['Gardien','Défenseur central','Latéral','Milieu défensif','Milieu relayeur','Milieu offensif','Ailier','Avant-centre'];
const CATS=['U11','U12','U13','U14','U15','U16','U17','U18','U19','U20','Séniors'];
const CRIT={
  'Gardien':['Jeu au pied','Prise de balle','Jeu aérien / sorties','Réflexes / arrêts','Placement','Communication / organisation'],
  'Défenseur central':['Duels aériens','Duels au sol','Anticipation / interceptions','Relance courte','Jeu long','Placement / couverture'],
  'Latéral':['Vitesse / volume','Centres','Duels défensifs','Projection offensive','Replacement défensif','Qualité de passe'],
  'Milieu défensif':['Récupération / interceptions','Placement / lecture du jeu','Passe vers l\'avant','Gestion du tempo','Jeu long','Duels'],
  'Milieu relayeur':['Volume de jeu','Passe / orientation','Projection / percussion','Récupération','Jeu entre les lignes','Frappe'],
  'Milieu offensif':['Dernière passe','Vision / créativité','Contrôle orienté','Élimination','Frappe','Jeu entre les lignes'],
  'Ailier':['Vitesse / accélération','Dribble / 1c1','Centres / dernière passe','Finition','Appels en profondeur','Repli défensif'],
  'Avant-centre':['Finition','Jeu de tête','Appels / déplacements','Jeu dos au but / remises','Pressing','Présence dans la surface']
};
const COMMUNS=['Attitude / connaissance du poste','Comportement général','Concentration'];
const critsFor=p=>(CRIT[p]||[]).concat(COMMUNS);
const ALL_CRITS=[...new Set(Object.values(CRIT).flat().concat(COMMUNS))];
const SLOTS=[
  {id:'AG',l:'AG',x:17,y:8,p:['Ailier','Avant-centre']},
  {id:'AC',l:'AC',x:50,y:2,p:['Avant-centre']},
  {id:'AD',l:'AD',x:83,y:8,p:['Ailier','Avant-centre']},
  {id:'MR',l:'MR',x:22,y:27,p:['Milieu relayeur','Milieu offensif','Milieu défensif']},
  {id:'MO',l:'MO',x:78,y:27,p:['Milieu offensif','Milieu relayeur']},
  {id:'MDC',l:'MDC',x:50,y:41,p:['Milieu défensif','Milieu relayeur']},
  {id:'LG',l:'LG',x:14,y:50,p:['Latéral']},
  {id:'DCG',l:'DCG',x:37,y:65,p:['Défenseur central','Milieu défensif']},
  {id:'DCD',l:'DCD',x:63,y:65,p:['Défenseur central','Milieu défensif']},
  {id:'LD',l:'LD',x:86,y:50,p:['Latéral']},
  {id:'GB',l:'GB',x:50,y:82,p:['Gardien']}
];
const DEF={v:2,settings:{min:2,tranches:[
    {nom:'Élite',min:8,color:'#b8913a'},
    {nom:'Haut niveau',min:7,color:'#2f7d4f'},
    {nom:'Confirmé',min:6,color:'#2d6a9f'},
    {nom:'En progression',min:5,color:'#c27a1a'},
    {nom:'À revoir',min:0,color:'#b23b3b'}
  ]},joueurs:[],equipe:{},pending:[],imported:[]};

/* ================= ÉTAT & SAUVEGARDE ================= */
const clone=o=>JSON.parse(JSON.stringify(o));
function fixState(d){
  if(!d||!d.joueurs)d=clone(DEF);
  if(!d.v){d.v=2;if(d.settings)d.settings.min=2}
  d.settings=d.settings||clone(DEF.settings);d.equipe=d.equipe||{};d.pending=d.pending||[];d.imported=d.imported||[];
  d.joueurs.forEach(j=>{j.rapports=j.rapports||[];j.rapports.forEach(r=>{r.crit=r.crit||{};r.extra=r.extra||[]})});
  return d;
}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLD_KEY))}catch(e){}return fixState(d)}
let S=load(), view='poste', fPoste='all', fCat='all', fTxt='';
const idb=(()=>{let db;
  function open(){return db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('nes_dossier_fichiers',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
  function tx(mode,fn){return open().then(d=>new Promise((res,rej)=>{const t=d.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))}
  return{put:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>{}),get:k=>tx('readonly',s=>s.get(k)).catch(()=>null),del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>{})};
})();
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  idb.put('__etat__',clone(S));
}
let STORAGE_OK=true;
function checkStorage(){
  if(!/^https?:$/.test(location.protocol)||location.origin==='null')STORAGE_OK=false;
  try{localStorage.setItem('__t','1');if(localStorage.getItem('__t')!=='1')STORAGE_OK=false;localStorage.removeItem('__t')}catch(e){STORAGE_OK=false}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
function storageBanner(){
  if(STORAGE_OK)return'';
  return`<div class="card" style="border-color:var(--bad);background:#fdeeee"><h2 style="color:var(--bad)">⚠️ Rien n'est enregistré dans ce mode</h2>
  <p class="note" style="margin:0;color:var(--ink)">Le fichier est ouvert en aperçu : tout s'efface à la fermeture. Ouvre-le depuis ton lien GitHub Pages (https://…github.io/…).</p>
  <div class="btns"><button class="btn dark sm" onclick="exportJSON()">Sauver maintenant (.json)</button>
  <label class="btn ghost sm" style="margin:0;color:var(--ink)">Recharger une sauvegarde<input type="file" accept=".json" hidden onchange="importJSON(this)"></label></div></div>`;
}

/* ================= OUTILS ================= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>n==null||isNaN(n)?'–':(+n).toFixed(d);
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('fr-FR'):'';
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fullName=j=>`${j.prenom||''} ${(j.nom||'').toUpperCase()}`.trim();
const P=id=>S.joueurs.find(x=>x.id===id);
function toast(html,ms=6000){const t=document.getElementById('toast');t.innerHTML=html;t.classList.add('open');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('open'),ms)}
function busy(txt){const b=document.getElementById('busy');if(txt){b.textContent=txt;b.classList.add('open')}else b.classList.remove('open')}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}
function squareThumb(src,s=320){
  const c=document.createElement('canvas');c.width=c.height=s;const ctx=c.getContext('2d');
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,m=Math.min(w,h);
  const sy=h>w?(h-m)*0.15:(h-m)/2;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,s,s);ctx.drawImage(src,(w-m)/2,sy,m,m,0,0,s,s);
  return c.toDataURL('image/jpeg',.78);
}
function fileToPhoto(file,size){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>res(squareThumb(img,size));img.onerror=()=>res(null);img.src=e.target.result};r.readAsDataURL(file)})}

/* ================= CLASSEMENT ================= */
function tranches(){return [...S.settings.tranches].sort((a,b)=>b.min-a.min)}
function tierOf(v){return v==null?null:(tranches().find(t=>v>=t.min)||tranches().at(-1))}
function stats(j){
  const r=[...j.rapports].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const n=r.length;
  if(!n)return{n,avg:null,last:null,trend:0,best:null,tier:null,classed:false};
  const notes=r.map(x=>+x.note);
  const avg=avgOf(notes);
  let trend=0;
  if(n>=3){const k=Math.min(3,Math.floor(n/2));trend=avgOf(notes.slice(-k))-avgOf(notes.slice(0,-k))}
  const classed=n>=S.settings.min;
  return{n,avg,last:notes.at(-1),trend,best:Math.max(...notes),tier:classed?tierOf(avg):null,classed};
}
function critAverages(j){
  const acc={};
  j.rapports.forEach(r=>{Object.entries(r.crit||{}).forEach(([k,v])=>{if(v==null)return;(acc[k]=acc[k]||[]).push(+v)})});
  const out={};Object.keys(acc).forEach(k=>out[k]=avgOf(acc[k]));return out;
}
function reportNote(crit,extra){const v=Object.values(crit||{}).filter(x=>x!=null).map(Number).concat((extra||[]).map(e=>+e.v));return v.length?+avgOf(v).toFixed(2):null}
function slotOf(pid){for(const s of SLOTS)if((S.equipe[s.id]||[]).includes(pid))return s;return null}
function slotPlayers(id){return (S.equipe[id]||[]).map(P).filter(Boolean).sort(sortByAvg)}
function sortByAvg(a,b){const x=stats(a),y=stats(b);if(x.classed!==y.classed)return x.classed?-1:1;return(y.avg??-1)-(x.avg??-1)}

/* ================= RENDU LISTES ================= */
function avatar(j,cls=''){return j.photo?`<img class="avatar ${cls}" src="${j.photo}">`:`<div class="avatar ${cls}">${esc(((j.prenom||'')[0]||'')+((j.nom||'')[0]||'')).toUpperCase()}</div>`}
function trendHtml(t){if(Math.abs(t)<0.15)return'';return t>0?`<span class="trend" style="color:var(--ok)">▲ ${t.toFixed(1)}</span>`:`<span class="trend" style="color:var(--bad)">▼ ${Math.abs(t).toFixed(1)}</span>`}
function badge(st){
  if(!st.classed)return`<span class="badge" style="background:#9a9182">Observation ${st.n}/${S.settings.min}</span>`;
  return`<span class="badge" style="background:${st.tier.color}">${esc(st.tier.nom)}</span>`;
}
function playerRow(j,i){
  const st=stats(j),sl=slotOf(j.id);
  return`<div class="player" onclick="openPlayer('${j.id}')">
    ${i!=null?`<div class="rank">${i}</div>`:''}${avatar(j)}
    <div class="pinfo"><div class="pname">${esc(fullName(j))} ${sl?`<span class="star">★ ${sl.l}</span>`:''}</div>
    <div class="pmeta">${esc(j.poste||'Poste ?')}${j.categorie?' · '+esc(j.categorie):''}${j.club?' · '+esc(j.club):''} · ${st.n} rapport${st.n>1?'s':''}</div></div>
    <div class="score"><b>${fmt(st.avg)}</b><div>${badge(st)}</div>${trendHtml(st.trend)}</div>
  </div>`;
}
function filtersHtml(withPoste,withTxt){
  return`<div class="filters">
  ${withTxt?`<input placeholder="Rechercher…" value="${esc(fTxt)}" oninput="fTxt=this.value;clearTimeout(window._ft);window._ft=setTimeout(()=>{render();const i=document.querySelector('.filters input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)">`:''}
  ${withPoste?`<select onchange="fPoste=this.value;render()"><option value="all">Tous postes</option>${POSTES.map(p=>`<option ${fPoste===p?'selected':''}>${p}</option>`).join('')}</select>`:''}
  <select onchange="fCat=this.value;render()"><option value="all">Toutes catég.</option>${CATS.map(c=>`<option ${fCat===c?'selected':''}>${c}</option>`).join('')}</select>
  </div>`;
}
function filtered(){const t=nrm(fTxt.trim());return S.joueurs.filter(j=>(fCat==='all'||j.categorie===fCat)&&(!t||nrm(fullName(j)+' '+(j.club||'')).includes(t)))}
const dropZone=()=>`<div class="drop" onclick="pickFiles()"><b>📄 Déposer des rapports PDF</b><span>Plusieurs d'un coup · nom, poste, critères, note et photo lus automatiquement</span></div>`;

function render(){
  const tot=S.joueurs.length, cl=S.joueurs.filter(j=>stats(j).classed).length, rep=S.joueurs.reduce((a,j)=>a+j.rapports.length,0);
  document.getElementById('hsub').textContent=`${tot} joueur${tot>1?'s':''} · ${cl} classé${cl>1?'s':''} · ${rep} rapport${rep>1?'s':''} · classement dès ${S.settings.min} rapports`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const m=document.getElementById('main');
  if(view==='reglages')return renderSettings(m);
  if(view==='equipe')return renderEquipe(m);
  let html=storageBanner()+pendingHtml()+dropZone();
  if(!tot){m.innerHTML=html+`<div class="card"><h2>Dossier vide</h2><p class="empty">Importe tes rapports PDF ou crée un rapport avec « + Rapport ». Chaque joueur est classé automatiquement dès ${S.settings.min} rapports, puis le classement se réajuste à chaque nouveau rapport.</p></div>`;return}
  if(view==='poste'){
    const L=filtered();
    html+=filtersHtml(false,false)+POSTES.concat(['']).map(p=>{
      const js=L.filter(j=>(j.poste||'')===p).sort(sortByAvg);
      if(!js.length)return'';
      let k=0;
      return`<div class="card"><h2>${p||'Poste non défini'}<span class="count">${js.length}</span></h2>${js.map(j=>playerRow(j,stats(j).classed?++k:null)).join('')}</div>`;
    }).join('');
  }
  else if(view==='niveau'){
    const L=filtered().filter(j=>fPoste==='all'||j.poste===fPoste),T=tranches();
    html+=filtersHtml(true,false);
    T.forEach((t,i)=>{
      const js=L.filter(j=>{const s=stats(j);return s.classed&&s.tier.nom===t.nom}).sort(sortByAvg);
      html+=`<div class="card"><div class="tierhead"><h2><span class="badge" style="background:${t.color}">${esc(t.nom)}</span><span class="count">${js.length}</span></h2><span class="range">${t.min} → ${i===0?'10':'< '+T[i-1].min}</span></div>
      ${js.length?js.map((j,x)=>playerRow(j,x+1)).join(''):'<p class="empty">Aucun joueur</p>'}</div>`;
    });
    const obs=L.filter(j=>!stats(j).classed);
    html+=`<div class="card"><h2>En observation<span class="count">${obs.length}</span></h2><p class="note" style="margin-top:0">Moins de ${S.settings.min} rapports : pas encore classés.</p>${obs.map(j=>playerRow(j)).join('')||'<p class="empty">Aucun</p>'}</div>`;
  }
  else{
    const L=filtered().filter(j=>fPoste==='all'||j.poste===fPoste).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
    html+=filtersHtml(true,true)+`<div class="card"><h2>Tous les joueurs<span class="count">${L.length}</span></h2>${L.map(j=>playerRow(j)).join('')||'<p class="empty">Aucun</p>'}
    <div class="btns"><button class="btn ghost sm" onclick="openPlayerForm()">+ Ajouter un joueur sans rapport</button></div></div>`;
  }
  m.innerHTML=html;
}

/* ================= ÉQUIPE TYPE ================= */
function pitchLines(){return`<svg class="lines" viewBox="0 0 100 150" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5">
  <rect x="3" y="3" width="94" height="144"/><line x1="3" y1="75" x2="97" y2="75"/><circle cx="50" cy="75" r="11"/>
  <rect x="22" y="3" width="56" height="20"/><rect x="36" y="3" width="28" height="8"/><rect x="22" y="127" width="56" height="20"/><rect x="36" y="139" width="28" height="8"/></svg>`}
function renderEquipe(m){
  const n=SLOTS.reduce((a,s)=>a+(S.equipe[s.id]||[]).filter(P).length,0);
  m.innerHTML=storageBanner()+`<div class="card"><h2><img class="rlogo" style="height:34px" src="${document.getElementById('nesLogo').src}" alt="">★ Mon équipe type<span class="count">${n} joueur${n>1?'s':''}</span></h2>
  <p class="note" style="margin:0 0 10px">Jusqu'à 3 joueurs par poste. Ordre automatique selon la moyenne : le 1er (doré) est le titulaire. Touche un poste pour ajouter ou retirer.</p>
  <div class="pitch">${pitchLines()}${SLOTS.map(s=>{
    const js=slotPlayers(s.id);
    return`<div class="slot" style="left:${s.x}%;top:${s.y}%" onclick="openSlot('${s.id}')"><div class="sl">${s.l}</div>
    ${js.map((j,i)=>`<div class="srow ${i===0?'t':''}">${j.photo?`<img class="a" src="${j.photo}">`:`<span class="a">${esc((j.prenom||'?')[0])}</span>`}<span class="nm">${esc(j.nom||j.prenom)}</span><span class="v">${fmt(stats(j).avg,1)}</span></div>`).join('')}
    ${js.length<3?`<div class="add">+</div>`:''}</div>`}).join('')}</div>
  <div class="btns"><button class="btn ghost sm" onclick="window.print()">Imprimer / PDF</button></div></div>
  <div class="card"><h2>Détail par poste</h2>${SLOTS.map(s=>{const js=slotPlayers(s.id);return js.length?`<h3>${s.l} · ${s.p[0]}</h3>${js.map((j,i)=>playerRow(j,i+1)).join('')}`:''}).join('')||'<p class="empty">Aucun joueur dans l\'équipe type.</p>'}</div>`;
}
function openSlot(id){
  const s=SLOTS.find(x=>x.id===id),js=slotPlayers(id),inIds=S.equipe[id]||[];
  const elig=S.joueurs.filter(j=>!inIds.includes(j.id)&&s.p.includes(j.poste)).sort(sortByAvg);
  const others=S.joueurs.filter(j=>!inIds.includes(j.id)&&!s.p.includes(j.poste)).sort(sortByAvg);
  const addRow=j=>{const o=slotOf(j.id);return`<div class="player" onclick="setSlot('${j.id}','${id}',true)">${avatar(j)}<div class="pinfo"><div class="pname">${esc(fullName(j))}</div><div class="pmeta">${esc(j.poste||'?')} · ${fmt(stats(j).avg)}${o?' · déjà en '+o.l:''}</div></div><span class="btn sm">+</span></div>`};
  openSheet(`<div class="top"><h2 style="margin:0">${s.l} · ${s.p.join(' / ')}</h2><button class="x" onclick="closeSheet()">×</button></div>
  <h3>Dans l'équipe type (${js.length}/3)</h3>
  ${js.map((j,i)=>`<div class="player"><div class="rank">${i+1}</div>${avatar(j)}<div class="pinfo" onclick="openPlayer('${j.id}')"><div class="pname">${esc(fullName(j))}</div><div class="pmeta">${i===0?'Titulaire':'Alternative '+i} · ${fmt(stats(j).avg)}</div></div><button class="btn ghost sm" onclick="setSlot('${j.id}','',true,'${id}')">Retirer</button></div>`).join('')||'<p class="empty">Aucun joueur</p>'}
  ${js.length<3?`<h3>Ajouter</h3>${elig.map(addRow).join('')||'<p class="empty">Aucun joueur à ce poste dans le dossier.</p>'}
  ${others.length?`<details><summary>Autres postes (${others.length})</summary>${others.map(addRow).join('')}</details>`:''}`:'<p class="obs">Poste complet (3 joueurs). Retire un joueur pour en ajouter un autre.</p>'}`);
}
function setSlot(pid,slotId,fromSlot,reopen){
  SLOTS.forEach(s=>{if(S.equipe[s.id])S.equipe[s.id]=S.equipe[s.id].filter(x=>x!==pid)});
  if(slotId){S.equipe[slotId]=(S.equipe[slotId]||[]).filter(P);if(S.equipe[slotId].length>=3){alert('Ce poste a déjà 3 joueurs. Retires-en un d\'abord.');save();render();return}S.equipe[slotId].push(pid)}
  save();render();
  if(fromSlot)openSlot(slotId||reopen);else openPlayer(pid);
}

/* ================= RÉGLAGES ================= */
function renderSettings(m){
  const T=S.settings.tranches;
  m.innerHTML=storageBanner()+`<div class="card"><h2>Classement</h2>
    <label>Nombre de rapports avant d'être classé</label>
    <input type="number" min="1" max="20" value="${S.settings.min}" onchange="S.settings.min=Math.max(1,+this.value||1);save();render()">
    <p class="note">Ensuite, la moyenne et la tranche se réajustent à chaque nouveau rapport.</p>
  </div>
  <div class="card"><h2>Tranches de niveau (moyenne /10)</h2>
    ${T.map((t,i)=>`<div class="tierrow">
      <input value="${esc(t.nom)}" onchange="S.settings.tranches[${i}].nom=this.value;save();render()">
      <input type="number" step="0.5" min="0" max="10" value="${t.min}" onchange="S.settings.tranches[${i}].min=+this.value;save();render()">
      <input type="color" value="${t.color}" onchange="S.settings.tranches[${i}].color=this.value;save()">
    </div>`).join('')}
    <p class="note">Chaque tranche commence à sa note minimum. La plus basse doit être à 0.</p>
    <div class="btns"><button class="btn ghost" onclick="S.settings.tranches.push({nom:'Nouvelle',min:0,color:'#888888'});save();render()">+ Tranche</button>${T.length>2?`<button class="btn ghost" onclick="S.settings.tranches.pop();save();render()">– Retirer la dernière</button>`:''}
    <button class="btn ghost" onclick="S.settings.tranches=clone(DEF.settings.tranches);save();render()">Par défaut</button></div>
  </div>
  <div class="card"><h2>Sauvegarde</h2>
    <p class="note" style="margin-top:0">Tout reste sur ce téléphone (enregistré en double). L'export .json garde joueurs, rapports, photos, équipe type et classement — pas les PDF d'origine.</p>
    <div class="btns">
      <button class="btn dark" onclick="exportJSON()">Exporter (.json)</button>
      <label class="btn ghost" style="margin:0;color:var(--ink);font-size:14px">Importer<input type="file" accept=".json" hidden onchange="importJSON(this)"></label>
      <button class="btn red" onclick="if(confirm('Tout supprimer définitivement ?')){S=clone(DEF);save();render()}">Tout effacer</button>
    </div>
  </div>`;
}

/* ================= FEUILLES ================= */
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('ov').classList.add('open');document.getElementById('sheet').scrollTop=0;document.getElementById('menu').classList.remove('open')}
function closeSheet(){document.getElementById('ov').classList.remove('open')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
function printSheet(){document.body.classList.add('psheet');window.print();setTimeout(()=>document.body.classList.remove('psheet'),800)}

/* ---- radar ---- */
function radar(labels,values,size=320){
  const n=labels.length;if(n<3)return'';
  const c=size/2,R=size/2-58;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+Math.cos(a)*R*v/10,c+Math.sin(a)*R*v/10]};
  let g='';
  [2,4,6,8,10].forEach(l=>{g+=`<polygon points="${labels.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#e4dccb" stroke-width="1"/>`});
  labels.forEach((lb,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#e4dccb"/>`;
    const[lx,ly]=pt(i,12.6);const anc=Math.abs(lx-c)<8?'middle':lx<c?'end':'start';
    const words=lb.split(/\s*\/\s*|\s+(?=\S{4,})/).slice(0,2);
    g+=`<text x="${lx}" y="${ly-(words.length-1)*5}" font-size="9.5" fill="#7a7266" text-anchor="${anc}" font-weight="600">${words.map((w,k)=>`<tspan x="${lx}" dy="${k?11:0}">${esc(w)}</tspan>`).join('')}</text>`});
  const poly=values.map((v,i)=>pt(i,v??0).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(184,145,58,.35)" stroke="#b8913a" stroke-width="2"/>`;
  values.forEach((v,i)=>{if(v==null)return;const[x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3" fill="#14130f"/>`});
  return`<svg class="radar" viewBox="0 0 ${size} ${size}">${g}</svg>`;
}
function bars(entries){
  return entries.map(([k,v])=>{const t=tierOf(v);return`<div class="bar"><span>${esc(k)}</span><div class="t"><i style="width:${(v||0)*10}%;background:${t?t.color:'#ccc'}"></i></div><b>${fmt(v,1)}</b></div>`}).join('');
}
function spark(j){
  const r=[...j.rapports].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(r.length<2)return'';
  const W=300,H=100,p=14,n=r.length,X=i=>p+i*(W-2*p)/(n-1),Y=v=>H-p-(v/10)*(H-2*p),st=stats(j);
  const lines=tranches().filter(t=>t.min>0).map(t=>`<line x1="${p}" x2="${W-p}" y1="${Y(t.min)}" y2="${Y(t.min)}" stroke="${t.color}" stroke-dasharray="3 3" opacity=".45"/>`).join('');
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}
  <line x1="${p}" x2="${W-p}" y1="${Y(st.avg)}" y2="${Y(st.avg)}" stroke="#14130f" opacity=".25"/>
  <polyline points="${r.map((x,i)=>`${X(i)},${Y(+x.note)}`).join(' ')}" fill="none" stroke="#b8913a" stroke-width="2.5"/>
  ${r.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(+x.note)}" r="3.5" fill="#14130f"/>`).join('')}</svg>`;
}

/* ================= LECTURE DES FICHIERS ================= */
let pdfLib=null;
function loadPdfJs(){
  if(pdfLib)return Promise.resolve(pdfLib);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(pdfLib)};
    s.onerror=()=>rej(new Error('Connexion internet nécessaire pour lire les PDF.'));
    document.head.appendChild(s);
  });
}
async function pdfRead(buf,wantPhoto=true){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
  const lines=[];let best=null;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{
      if(!it.str||!it.str.trim())return;
      const y=it.transform[5],x=it.transform[4],h=Math.abs(it.transform[3])||10;
      let r=rows.find(r=>Math.abs(r.y-y)<Math.max(2.5,h*0.35));

const POSTE_MAP=[
  ['milieu defensif','Milieu défensif'],['milieu relayeur','Milieu relayeur'],['milieu offensif','Milieu offensif'],
  ['defenseur central','Défenseur central'],['defenseur axial','Défenseur central'],['avant-centre','Avant-centre'],['avant centre','Avant-centre'],
  ['lateral','Latéral'],['arriere droit','Latéral'],['arriere gauche','Latéral'],['piston','Latéral'],
  ['gardien','Gardien'],['ailier','Ailier'],['sentinelle','Milieu défensif'],['relayeur','Milieu relayeur'],['box to box','Milieu relayeur'],
  ['meneur','Milieu offensif'],['attaquant','Avant-centre'],['buteur','Avant-centre'],['pointe','Avant-centre'],
  ['defenseur','Défenseur central'],['milieu','Milieu relayeur']

function mapPoste(s){const n=nrm(s);for(const[k,v]of POSTE_MAP)if(labRe(k).test(n))return v;

function toTen(v,sc){if(sc===20)return v/2;if(sc===5)return v*2;if(sc===100)return v/10;if(!sc&&v>10&&v<=20)return v/2;if(!sc&&v>20&&v<=100)return v/10;return v}

function findNote(lines){

      const n=nrm(lines[i]);const m=n.match(re);if(!m)continue;

function critVariants(name){

function extractCrit(lines,names){
  const out={},used=new Set();

    const vars=critVariants(name);
    outer:for(let i=0;i<lines.length;i++){
      const n=nrm(lines[i]);
      for(const v of vars){
        const re=labRe(v);const m=n.match(re);if(!m)continue;
        const key=i+':'+(m.index+m[1].length);if(used.has(key))continue;
        const end=m.index+m[1].length+v.length;

function nameFromFile(fn){

async function importFiles(files){
  const res={ok:0,newP:0,pend:0,dup:0,err:[]},msgs=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];busy(`Lecture ${i+1}/${files.length}\n${f.name}`);
    const sig=f.name+'|'+f.size;
    if(S.imported.includes(sig)){res.dup++;continue}
    try{
      const buf=await f.arrayBuffer();
      const isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
      let rd=isPdf?await pdfRead(buf):htmlRead(new TextDecoder().decode(buf));
      if(!isPdf&&rd.photo)rd.photo=await dataUrlToPhoto(rd.photo);
      let d=parseReport(rd.lines,f.name,f.lastModified);
      const ex=d.prenom||d.nom?findPlayer(d.prenom,d.nom):null;
      if(ex&&ex.poste&&ex.poste!==d.poste)d=parseReport(rd.lines,f.name,f.lastModified,ex.poste);
      d.photo=rd.photo;
      const id=uid();
      await idb.put(id,{name:f.name,blob:new Blob([buf],{type:isPdf?'application/pdf':'text/html'})});
      S.imported.push(sig);
      const complete=(d.prenom||d.nom)&&d.note!=null&&d.date&&(d.poste||ex);
      if(complete){const r=commit(id,d,f.name);if(r.created)res.newP++;if(r.msg)msgs.push(r.msg);res.ok++}
      else{S.pending.push({id,file:f.name,d,text:rd.lines.join('\n').slice(0,6000),empty:!rd.lines.length});res.pend++}
      save();
    }catch(err){res.err.push(f.name+' : '+(err.message||'lecture impossible'))}
  }
  busy();render();
  let msg=`<b>${res.ok} rapport${res.ok>1?'s':''} ajouté${res.ok>1?'s':''}</b>`;
  if(res.newP)msg+=` · ${res.newP} nouveau${res.newP>1?'x':''} joueur${res.newP>1?'s':''}`;
  if(res.pend)msg+=`<br>${res.pend} fichier${res.pend>1?'s':''} à vérifier (en haut de page)`;
  if(res.dup)msg+=`<br>${res.dup} déjà importé${res.dup>1?'s':''}, ignoré${res.dup>1?'s':''}`;
  if(msgs.length)msg+='<br>'+msgs.join('<br>');
  if(res.err.length)msg+='<br>⚠️ '+res.err.map(esc).join('<br>');
  toast(msg,10000);
}
function commit(id,d,file){

  if(!j){j={id:uid(),prenom:d.prenom||'',nom:d.nom||'',poste:d.poste||'',categorie:d.categorie||'',club:d.club||'',niveau:'',naissance:d.naissance||'',pied:d.pied||'',notes:'',photo:d.photo||null,rapports:[]};S.joueurs.push(j);created=true}

function pendingHtml(){
  if(!S.pending.length)return'';
  return`<div class="card alert"><h2>À vérifier<span class="count">${S.pending.length}</span></h2>
  <p class="note" style="margin:0 0 6px">Fichiers lus en partie. Complète seulement ce qui est en rouge.</p>
  <datalist id="plist">${S.joueurs.map(j=>`<option value="${esc(j.prenom+' '+j.nom)}">`).join('')}</datalist>
  ${S.pending.map(p=>{const d=p.d,name=[d.prenom,d.nom].filter(Boolean).join(' '),ex=findPlayer(d.prenom,d.nom);
    const needName=!name,needPoste=!d.poste&&!ex,needNote=d.note==null,needDate=!d.date;
    return`<div class="pend"><div class="fname">📄 ${esc(p.file)}</div>
    ${p.empty?'<div class="obs">Aucun texte lisible : PDF scanné en image. Complète les champs en rouge.</div>':''}
    <div class="chips">
      <span class="chip ${needName?'miss':''}">${name?esc(name):'Nom ?'}</span>
      <span class="chip ${needPoste?'miss':''}">${esc(d.poste||(ex?ex.poste:'')||'Poste ?')}</span>
      <span class="chip ${needNote?'miss':''}">${d.note!=null?d.note+'/10':'Note ?'}</span>
      <span class="chip ${needDate?'miss':''}">${d.date?fdate(d.date):'Date ?'}</span>
      ${Object.keys(d.crit||{}).length?`<span class="chip">${Object.keys(d.crit).length} critères</span>`:''}${d.photo?'<span class="chip">📷</span>':''}
    </div>
    ${needName?`<label>Joueur</label><input id="pn_${p.id}" list="plist" placeholder="Prénom Nom">`:''}
    ${needPoste?`<label>Poste</label><select id="pp_${p.id}"><option value="">—</option>${POSTES.map(x=>`<option>${x}</option>`).join('')}</select>`:''}
    ${needNote?`<label>Note du match /10</label><input id="pt_${p.id}" type="number" step="0.1" min="0" max="10" inputmode="decimal">`:''}
    ${needDate?`<label>Date du match</label><input id="pd_${p.id}" type="date">`:''}
    <div class="btns"><button class="btn sm" onclick="validatePending('${p.id}')">Valider</button><button class="btn ghost sm" onclick="openFile('${p.id}')">Voir le fichier</button><button class="btn ghost sm" onclick="dropPending('${p.id}')">Retirer</button></div>
    <details><summary>Texte lu dans le fichier</summary><pre>${esc(p.text||'(vide)')}</pre></details></div>`}).join('')}</div>`;
}
function validatePending(id){
  const p=S.pending.find(x=>x.id===id),d={...p.d};
  const g=k=>{const el=document.getElementById(k+id);return el?el.value.trim():null};
  const n=g('pn_');if(n!=null){if(!n)return alert('Nom du joueur requis');const ex=S.joueurs.find(j=>nrm(j.prenom+' '+j.nom)===nrm(n));Object.assign(d,ex?{prenom:ex.prenom,nom:ex.nom}:splitName(n))}
  const ps=g('pp_');if(ps!=null){if(!ps&&!findPlayer(d.prenom,d.nom))return alert('Poste requis');if(ps)d.poste=ps}
  const t=g('pt_');if(t!=null){const v=parseFloat(t.replace(',','.'));if(isNaN(v)||v<0||v>10)return alert('Note entre 0 et 10');d.note=v;d.noteHow='saisie'}
  const dt=g('pd_');if(dt!=null){if(!dt)return alert('Date requise');d.date=dt}
  const r=commit(id,d,p.file);S.pending=S.pending.filter(x=>x.id!==id);save();render();
  toast('Rapport ajouté'+(r.msg?'<br>'+r.msg:''));
}
function dropPending(id){if(!confirm('Retirer ce fichier ?'))return;const p=S.pending.find(x=>x.id===id);S.pending=S.pending.filter(x=>x.id!==id);S.imported=S.imported.filter(s=>!s.startsWith(p.file+'|'));idb.del(id);save();render()}

/* ================= EXPORT ================= */
function exportJSON(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dossier-nes-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.joueurs)throw 0;
    if(confirm('Remplacer le dossier actuel par cette sauvegarde ?')){S=fixState(d);save();render()}}catch(x){alert('Fichier invalide')}};r.readAsText(f);
}

/* ================= DÉMARRAGE ================= */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
(async()=>{
  checkStorage();render();
  const bk=await idb.get('__etat__');
  if(bk&&bk.joueurs&&(bk.savedAt||0)>(S.savedAt||0)){S=fixState(bk);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
})();
</script>
</body>
</html>
